<!doctype html>
<html lang="vi" data-theme="dark" data-board="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cờ vua – đấu với Stockfish</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="logo"><svg viewBox="0 0 45 45" aria-hidden="true"><path d="M14 35c0-9 3-13 7-17-3-.5-5-2.5-6-5.5 5-4 12-3 15 2 3 4 3.5 12 3.5 20.5z"/></svg><b>Cờ vua</b></div>
  <div class="tools">
    <select id="boardSel" aria-label="Màu bàn cờ"><option value="green">Bàn cờ: Xanh lá</option><option value="brown">Bàn cờ: Nâu</option><option value="blue">Bàn cờ: Xanh biển</option></select>
    <button id="themeBtn" type="button">Giao diện sáng</button>
  </div>
</header>
<div id="banner" class="banner" hidden></div>
<main class="game">
  <section class="boardWrap">
    <div class="player" id="topPlayer"><div class="av"></div><div class="who"><div><span class="name"></span> <span class="elo"></span></div><div class="cap"></div></div><span class="clock"></span></div>
    <div id="board" class="board" role="grid" aria-label="Bàn cờ"></div>
    <div class="player" id="botPlayer"><div class="av"></div><div class="who"><div><span class="name"></span> <span class="elo"></span></div><div class="cap"></div></div><span class="clock"></span></div>
  </section>
  <aside class="side">
    <div class="sideHead">Chơi với máy</div>
    <div id="status" class="status" aria-live="polite">Đang tải engine…</div>
    <ol id="moves" class="moves"></ol>
    <div class="nav">
      <button id="firstBtn" type="button" title="Về đầu ván">«</button><button id="prevBtn" type="button" title="Nước trước (←)">‹</button><button id="nextBtn" type="button" title="Nước sau (→)">›</button><button id="lastBtn" type="button" title="Về nước mới nhất">»</button><button id="flipBtn" type="button" title="Lật bàn cờ">Lật bàn</button>
    </div>
    <div class="btns">
      <button id="newBtn" type="button">Ván mới</button>
      <button id="replayBtn" type="button">Chơi lại</button>
      <button id="undoBtn" type="button">Quay lại nước</button>
      <button id="resignBtn" type="button">Xin thua</button>
      <button id="analyzeBtn" type="button">Phân tích</button>
      <button id="contBtn" type="button" hidden>Chơi tiếp từ thế này</button>
      <button id="pgnBtn" type="button">Xuất PGN</button>
      <button id="importBtn" type="button">Nhập PGN</button>
      <button id="histBtn" type="button">Lịch sử</button>
    </div>
    <div id="report" class="report" hidden></div>
  </aside>
</main>

<dialog id="setup">
  <form method="dialog" id="setupForm">
    <h2>Ván mới</h2>
    <label>Sức mạnh AI (Elo mục tiêu) <select id="eloSel"></select></label>
    <label>Quân của bạn <select id="colorSel"><option value="w">Trắng</option><option value="b">Đen</option><option value="r">Ngẫu nhiên</option></select></label>
    <label>Thời gian <select id="tcSel"><option value="">Không tính giờ</option><option>1+0</option><option>3+2</option><option>5+0</option><option>10+0</option><option>15+10</option></select></label>
    <label class="chk"><input type="checkbox" id="practiceChk"> Chế độ luyện tập (cho phép quay lại nước đi)</label>
    <p class="note">Elo là mức ước lượng, chưa được kiểm định bằng ván đấu chuẩn.</p>
    <menu><button value="go" id="goBtn">Bắt đầu</button></menu>
  </form>
</dialog>
<dialog id="resDlg"><h2 id="resTitle"></h2><p id="resNote"></p><menu><button id="resAnalyze" type="button">Phân tích</button><button id="resNew" type="button">Ván mới</button></menu></dialog>
<dialog id="promo"><p>Phong cấp tốt thành:</p><div id="promoBtns"></div></dialog>
<dialog id="pgnDlg"><h2 id="pgnTitle"></h2><textarea id="pgnText" rows="10"></textarea><menu><button id="pgnGo" type="button"></button><button id="pgnClose" type="button">Đóng</button></menu></dialog>
<dialog id="histDlg"><h2>Lịch sử ván đấu</h2><div id="histList"></div><menu><button id="histClear" type="button">Xóa lịch sử</button><button id="histClose" type="button">Đóng</button></menu></dialog>
<script type="module" src="js/app.js"></script>
</body>
</html>
